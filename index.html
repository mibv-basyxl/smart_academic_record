<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcademicIQ — Smart Academic Performance Analytics Dashboard for Universities</title>
<meta name="description" content="AcademicIQ — Turn Academic Data Into Better Student Outcomes.">
<style>
/* ==========================================================================
   AcademicIQ — stylesheet
   Design tokens first, then layout, components, responsive, print.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e2e9f4;
  --border:#d9e2ef; --text:#101c2e; --muted:#5b6b82; --heading:#0b1729;
  --primary:#1d4ed8; --primary-2:#2563eb; --primary-weak:#e2ebff; --on-primary:#ffffff;
  --teal:#0f766e; --teal-weak:#ccfbf1;
  --good:#15803d; --good-weak:#dcfce7;
  --warn:#b45309; --warn-weak:#fef3c7;
  --bad:#b91c1c; --bad-weak:#fee2e2;
  --navy:#0b1a33; --navy-2:#12264a; --navy-text:#c3d1e7; --navy-muted:#7d90ad;
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
  --shadow:0 1px 2px rgba(11,26,43,.06), 0 6px 18px rgba(11,26,43,.06);
  --shadow-sm:0 1px 2px rgba(11,26,43,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#070d18; --surface:#0f1a2c; --surface-2:#152238; --surface-3:#1c2c46;
  --border:#24344f; --text:#e6edf7; --muted:#93a4bd; --heading:#f2f6fc;
  --primary:#4d84ff; --primary-2:#5c8fff; --primary-weak:#152b52; --on-primary:#04101f;
  --teal:#2dd4bf; --teal-weak:#0d3b38;
  --good:#4ade80; --good-weak:#0e3a20;
  --warn:#fbbf24; --warn-weak:#3d2c06;
  --bad:#f87171; --bad-weak:#43141a;
  --navy:#060e1c; --navy-2:#0e1c33; --navy-text:#b9c8e0; --navy-muted:#7286a5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--heading); margin:0 0 .4rem; line-height:1.25; font-weight:650}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0 0 .7rem}
a{color:var(--primary); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit}
code,kbd{font-family:var(--mono); font-size:.86em}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--primary);color:var(--on-primary);padding:10px 16px;z-index:200}
.skip:focus{left:8px;top:8px}

/* ---------- Auth layout ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:linear-gradient(150deg,#0b1a33 0%,#12305e 45%,#0f766e 100%)}
.auth-card{width:100%;max-width:440px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:0 24px 60px rgba(3,10,22,.45);padding:30px;border:1px solid var(--border)}
.auth-card.wide{max-width:720px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.auth-brand .mark{width:40px;height:40px;border-radius:11px;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.5px;font-size:15px}
.auth-brand .name{font-weight:750;font-size:1.15rem;color:var(--heading);letter-spacing:-.02em}
.auth-brand .tag{font-size:.72rem;color:var(--muted);display:block;margin-top:-2px}
.auth-foot{margin-top:16px;text-align:center;color:var(--muted);font-size:.85rem}

/* ---------- Public landing page ---------- */
.landing{--land-ink:#112a32;--land-muted:#61747a;--land-green:#168675;--land-line:#e6ece9;
  color:var(--land-ink);background:#fbfcfa;min-height:100vh;font-family:var(--font);overflow:hidden}
.landing a{text-decoration:none}
.landing-nav,.landing-hero,.landing-trust,.landing-features,.landing-how,.landing-footer{width:min(1160px,calc(100% - 64px));margin:0 auto}
.landing-nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0ed}
.landing-brand{display:inline-flex;align-items:center;gap:10px;color:#17353a!important;font-size:1.08rem;font-weight:800;letter-spacing:-.045em}
.landing-brand>span:last-child>span{color:var(--land-green)}
.landing-mark{width:34px;height:34px;background:#153f3a;color:#d9f1e9;border-radius:11px;display:grid;place-items:center;
  font-size:1rem;letter-spacing:-.06em}
.landing-nav nav{display:flex;align-items:center;gap:34px}
.landing-nav nav a,.landing-signin{font-size:.83rem;font-weight:650;color:#50656a!important}
.landing-nav nav a:hover,.landing-footer>a:last-child:hover{color:var(--land-green)!important}
.landing .landing-signin{border:1px solid #dce6e1;border-radius:9px;padding:10px 15px;color:#17353a!important}
.landing .landing-signin span{margin-left:8px;color:var(--land-green)}
.landing-hero{min-height:584px;display:grid;grid-template-columns:1fr 1.06fr;align-items:center;gap:46px;padding:46px 0 55px}
.landing-copy{position:relative;z-index:2;padding-bottom:5px}
.landing-eyebrow,.landing-label{display:inline-flex;align-items:center;gap:9px;color:#257b6c;font-size:.7rem;
  font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.landing-eyebrow{padding:8px 12px;border:1px solid #dcebe4;background:#f2f8f4;border-radius:999px;letter-spacing:.07em;text-transform:none;font-size:.76rem}
.landing-eyebrow>span{width:7px;height:7px;background:#279a78;border-radius:50%;box-shadow:0 0 0 4px #d9f0e5}
.landing h1{max-width:570px;margin:24px 0 18px;color:#173238;font-size:clamp(3rem,5.5vw,4.65rem);font-weight:650;letter-spacing:-.075em;line-height:1.03}
.landing h1 em,.landing-section-head h2 em,.landing-how h2 em{font-family:Georgia,serif;font-weight:500;color:#198674;letter-spacing:-.065em}
.landing-lead{max-width:475px;color:var(--land-muted);font-size:1.04rem;line-height:1.8}
.landing-actions{display:flex;align-items:center;gap:24px;margin-top:29px}
.landing .landing-cta{display:inline-flex;align-items:center;justify-content:center;gap:22px;background:#174a40;color:#fff;
  padding:14px 19px;border-radius:9px;font-size:.85rem;font-weight:700;box-shadow:0 8px 20px #164c3e24;transition:transform .18s,background .18s}
.landing .landing-cta:hover{background:#11614f;transform:translateY(-2px)}
.landing-secondary{color:#52676a!important;font-size:.82rem;font-weight:650}
.landing-secondary span{margin-left:6px;color:var(--land-green)}
.landing-proof{display:flex;align-items:center;gap:12px;margin-top:38px;color:#758487;font-size:.74rem}
.landing-avatars{display:flex;padding-left:3px}
.landing-avatars span{display:grid;place-items:center;width:27px;height:27px;margin-left:-4px;border:2px solid #fbfcfa;border-radius:50%;
  background:#e5efe8;color:#31594e;font-size:.52rem;font-weight:800}
.landing-avatars span:nth-child(2){background:#f4e8d9;color:#896b43}.landing-avatars span:nth-child(3){background:#e5e9f3;color:#566584}
.landing-visual{position:relative;min-height:430px;display:grid;place-items:center}
.landing-orbit{position:absolute;border:1px solid #e3ece5;border-radius:50%;pointer-events:none}
.landing-orbit-one{width:440px;height:440px}.landing-orbit-two{width:520px;height:520px;border-color:#eef2ed}
.preview-card{position:relative;z-index:1;width:min(100%,490px);padding:23px 24px 17px;border:1px solid #e6ece8;border-radius:17px;
  background:#fff;box-shadow:0 22px 65px #183a2a12,0 3px 10px #173c2810}
.preview-top{display:flex;align-items:center;justify-content:space-between}
.preview-top>div{display:grid;gap:5px}
.preview-kicker{color:#8c9a98;font-size:.58rem;font-weight:800;letter-spacing:.12em}
.preview-top strong{color:#203b3c;font-size:1rem}
.preview-period{padding:7px 9px;border:1px solid #e9eeeb;border-radius:7px;color:#647571;font-size:.64rem}
.preview-period span{margin-left:8px}
.preview-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.preview-metrics>div{display:grid;gap:5px;padding:13px 14px;background:#f7f9f7;border-radius:10px}
.preview-metrics>div>span{color:#81908d;font-size:.64rem}
.preview-metrics strong{color:#193936;font-size:1.55rem;letter-spacing:-.06em}
.preview-metrics strong small{font-size:.7rem;color:#8a9994;font-weight:550;letter-spacing:0}
.preview-metrics i{color:#25876c;font-size:.58rem;font-style:normal}
.preview-chart-head{display:flex;align-items:center;justify-content:space-between;margin-top:21px}
.preview-chart-head strong{color:#344b49;font-size:.73rem}
.preview-chart-head span{color:#84928f;font-size:.61rem}
.preview-chart{display:block;width:100%;height:auto;margin-top:7px;overflow:visible}
.preview-foot{display:flex;justify-content:space-between;align-items:center;color:#8a9994;font-size:.59rem}
.preview-foot>span:first-child{display:flex;align-items:center;gap:6px}
.preview-foot i{width:7px;height:7px;border-radius:50%;background:#168675}
.preview-float,.preview-note{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;background:#fff;
  border:1px solid #e8eeea;border-radius:12px;box-shadow:0 12px 32px #183a2a17}
.preview-float{right:-16px;bottom:30px;padding:11px 14px}
.float-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#e6f5ed;color:#168675;font-weight:800}
.preview-float strong,.preview-float small{display:block}.preview-float strong{color:#27433d;font-size:.68rem}
.preview-float small{margin-top:2px;color:#82908b;font-size:.58rem}
.preview-note{left:-22px;top:62px;padding:12px;color:#314c43;font-size:.68rem;line-height:1.4}
.preview-note>span{font-size:1.15rem;color:#188775}
.landing-trust{min-height:95px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--land-line);border-bottom:1px solid var(--land-line)}
.landing-trust>span{color:#879490;font-size:.6rem;font-weight:800;letter-spacing:.11em}
.landing-trust strong{color:#536662;font-size:.82rem;font-weight:650}
.landing-trust i{width:4px;height:4px;border-radius:50%;background:#9bb7a9}
.landing-features{padding:100px 0 108px}
.landing-section-head{max-width:650px;margin:0 auto 42px;text-align:center}
.landing-section-head h2,.landing-how h2{margin:14px 0;color:#1a3638;font-size:clamp(2rem,3.5vw,3rem);letter-spacing:-.06em;line-height:1.13}
.landing-section-head>p,.landing-how>div:first-child>p{max-width:560px;margin:0 auto;color:#6c7c7b;font-size:.91rem;line-height:1.8}
.landing-feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.landing-feature{padding:24px 23px 21px;border:1px solid #e8eeea;border-radius:13px;background:#fff;transition:transform .18s,box-shadow .18s}
.landing-feature:hover{transform:translateY(-3px);box-shadow:0 15px 35px #173c2810}
.feature-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;font-size:1.15rem;font-weight:700}
.feature-blue{background:#e9f0fa;color:#4277b5}.feature-gold{background:#faf1df;color:#b28a43}.feature-green{background:#e5f3e9;color:#398366}
.landing-feature h3{margin:19px 0 8px;color:#233d3b;font-size:1rem}
.landing-feature p{min-height:54px;color:#71807d;font-size:.8rem;line-height:1.7}
.landing-feature>a{display:inline-flex;gap:10px;margin-top:11px;color:#287967;font-size:.74rem;font-weight:750}
.landing-how{display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:90px;margin-bottom:92px;padding:54px 58px;
  border:1px solid #e3ece6;border-radius:17px;background:linear-gradient(115deg,#f1f7f1,#f7f8f3)}
.landing-how h2{max-width:440px;font-size:2.35rem}
.landing-how>div:first-child>p{margin:0 0 22px}
.landing-how .landing-cta{padding:12px 16px;font-size:.78rem}
.landing-steps{display:grid;gap:21px}
.landing-steps>div{display:flex;gap:14px;align-items:flex-start}
.landing-steps>div>span{display:grid;place-items:center;flex:0 0 31px;height:31px;border:1px solid #dbe8de;border-radius:50%;color:#33856f;font-size:.65rem;font-weight:800}
.landing-steps p{display:grid;gap:4px;margin:2px 0}
.landing-steps strong{color:#304741;font-size:.79rem}.landing-steps small{color:#7b8983;font-size:.68rem;line-height:1.5}
.landing-footer{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--land-line)}
.landing-footer .landing-brand{font-size:.92rem}.landing-footer .landing-mark{width:29px;height:29px;border-radius:9px;font-size:.85rem}
.landing-footer>span{color:#8a9691;font-size:.68rem}.landing-footer>a:last-child{color:#527169;font-size:.74rem;font-weight:700}
.landing-footer>a:last-child span{margin-left:5px;color:#198674}
@media(max-width:900px){
  .landing-nav,.landing-hero,.landing-trust,.landing-features,.landing-how,.landing-footer{width:min(100% - 40px,720px)}
  .landing-hero{grid-template-columns:1fr;gap:12px;padding-top:58px}
  .landing-copy{max-width:620px;margin:0 auto}
  .landing-visual{min-height:430px;margin-top:12px}
  .landing-trust{flex-wrap:wrap;justify-content:center;padding:20px 5px}
  .landing-trust>span{flex-basis:100%;text-align:center}
  .landing-features{padding:78px 0}
  .landing-how{grid-template-columns:1fr;gap:34px;padding:38px}
}
@media(max-width:600px){
  .landing-nav,.landing-hero,.landing-trust,.landing-features,.landing-how,.landing-footer{width:calc(100% - 36px)}
  .landing-nav{height:68px}.landing-nav nav{display:none}.landing-mark{width:31px;height:31px}
  .landing .landing-signin{padding:8px 11px;font-size:.76rem}
  .landing-hero{padding-top:43px;min-height:0}
  .landing h1{font-size:clamp(2.7rem,13vw,4rem);margin-top:21px}
  .landing-lead{font-size:.91rem}
  .landing-actions{align-items:flex-start;flex-direction:column;gap:17px}
  .landing-proof{margin-top:27px}
  .landing-visual{min-height:340px;margin:0 -3px}
  .landing-orbit-one{width:320px;height:320px}.landing-orbit-two{width:380px;height:380px}
  .preview-card{padding:16px 14px 12px;border-radius:13px}
  .preview-metrics{gap:8px;margin-top:14px}.preview-metrics>div{padding:10px}
  .preview-metrics strong{font-size:1.24rem}
  .preview-float{right:-4px;bottom:3px;padding:9px 10px}
  .preview-note{left:-5px;top:14px;padding:9px;font-size:.6rem}
  .landing-trust{gap:12px 15px;min-height:102px}
  .landing-trust strong{font-size:.69rem}
  .landing-trust i{display:none}
  .landing-section-head h2,.landing-how h2{font-size:2.2rem}
  .landing-feature-grid{grid-template-columns:1fr;gap:11px}
  .landing-feature{padding:20px}
  .landing-feature p{min-height:0}
  .landing-how{padding:25px 21px;margin-bottom:56px}
  .landing-footer{min-height:74px}.landing-footer>span{display:none}
}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:var(--navy-text);position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;z-index:40}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--navy-2)}
.sidebar .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
.sidebar .brand .name{font-weight:750;color:#fff;font-size:1rem;letter-spacing:-.02em;line-height:1.1}
.sidebar .brand .tag{font-size:.68rem;color:var(--navy-muted);display:block}
.nav{padding:10px 8px;flex:1}
.nav-group{margin:10px 8px 4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-muted);font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--navy-text);
  font-size:.86rem;text-decoration:none;margin-bottom:2px;transition:background .12s,color .12s}
.nav a:hover{background:var(--navy-2);color:#fff;text-decoration:none}
.nav a.active{background:var(--primary);color:#fff;font-weight:600}
.nav a .ico{width:18px;text-align:center;font-size:.95rem;flex:0 0 auto}
.nav a .pill{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;font-size:.68rem;font-weight:700}
.sidebar .who{padding:12px 16px;border-top:1px solid var(--navy-2);font-size:.76rem;color:var(--navy-muted)}
.sidebar .who strong{display:block;color:#fff;font-size:.84rem}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:var(--shadow-sm)}
.hamburger{display:none;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 10px;cursor:pointer;color:var(--text)}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);
  color:var(--text);font-size:.85rem}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:60;padding:4px}
.suggest button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;
  border-radius:var(--radius-sm);cursor:pointer;color:var(--text)}
.suggest button:hover{background:var(--surface-2)}
.suggest .s-type{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:6px}
.suggest .s-empty{padding:10px;color:var(--muted);font-size:.82rem}
.topbar .spacer{flex:1}
.icon-btn{position:relative;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 9px;cursor:pointer;color:var(--text);font-size:.95rem;line-height:1}
.icon-btn:hover{background:var(--surface-2)}
.badge-dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:999px;
  min-width:17px;height:17px;font-size:.66rem;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border:1px solid var(--border);
  border-radius:999px;background:var(--surface-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex:0 0 auto}
.user-chip .u-name{font-size:.8rem;font-weight:600;line-height:1.1}
.user-chip .u-role{font-size:.68rem;color:var(--muted);line-height:1.1}
select,input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:.85rem}
select{cursor:pointer}
textarea{min-height:120px;font-family:var(--mono);font-size:.78rem;resize:vertical}
label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.hint{font-size:.72rem;color:var(--muted);margin-top:4px}
.err{font-size:.75rem;color:var(--bad);margin-top:4px;font-weight:600}
.content{padding:18px;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-head .titles{flex:1;min-width:220px}
.page-head .sub{color:var(--muted);font-size:.85rem;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;
  font-size:.84rem;font-weight:600;text-decoration:none;transition:background .12s,transform .06s}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-2)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-sm{padding:5px 10px;font-size:.76rem}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn-block{width:100%;justify-content:center}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- Cards, grids ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card.tight{padding:12px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{margin:0}
.card-head .spacer{flex:1}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(186px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .k-value{font-size:1.6rem;font-weight:750;color:var(--heading);margin:6px 0 2px;letter-spacing:-.02em}
.kpi .k-cap{font-size:.72rem;color:var(--muted)}
.kpi.good{border-left:4px solid var(--good)}
.kpi.warn{border-left:4px solid var(--warn)}
.kpi.bad{border-left:4px solid var(--bad)}
.kpi.info{border-left:4px solid var(--primary)}
.kpi.teal{border-left:4px solid var(--teal)}

/* ---------- Badges, pills, bars ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-low{background:var(--good-weak);color:var(--good)}
.b-mod{background:var(--warn-weak);color:var(--warn)}
.b-high{background:#ffe4cc;color:#9a3412}
.b-crit{background:var(--bad-weak);color:var(--bad)}
.b-info{background:var(--primary-weak);color:var(--primary)}
.b-neutral{background:var(--surface-2);color:var(--muted)}
.b-good{background:var(--good-weak);color:var(--good)}
.b-bad{background:var(--bad-weak);color:var(--bad)}
.b-warn{background:var(--warn-weak);color:var(--warn)}
.b-teal{background:var(--teal-weak);color:var(--teal)}
[data-theme="dark"] .b-high{background:#43220c;color:#fdba74}
.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:70px}
.progress > span{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress.good > span{background:var(--good)}
.progress.warn > span{background:var(--warn)}
.progress.bad > span{background:var(--bad)}
.progress-row{display:grid;grid-template-columns:1fr 74px 52px;align-items:center;gap:10px;padding:5px 0;font-size:.82rem}
.progress-row .p-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-row .p-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* ---------- Tables ---------- */
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:.82rem;min-width:640px}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 10px;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
table.data td{padding:9px 10px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data .nowrap{white-space:nowrap}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.pager button{padding:5px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;color:var(--text)}
.pager button[disabled]{opacity:.45;cursor:not-allowed}
.pager .pinfo{margin-right:auto}

/* ---------- States ---------- */
.state{border:1px dashed var(--border);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.state strong{display:block;color:var(--heading);margin-bottom:4px;font-size:.95rem}
.state.bad{border-color:var(--bad);color:var(--bad)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:var(--radius-sm);height:14px;margin-bottom:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- Toasts & modals ---------- */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:10px 12px;font-size:.83rem;animation:tin .18s ease-out}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.toast strong{display:block;color:var(--heading);margin-bottom:2px;font-size:.82rem}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(6,14,28,.55);display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:150}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:0 30px 70px rgba(3,10,22,.4);
  width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px}
.modal h2{margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart-wrap{width:100%;overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart-empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}

/* ---------- Misc ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--primary-weak);color:var(--primary);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;
  color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.83rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.note{background:var(--primary-weak);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:.8rem;color:var(--text)}
.note.warn{background:var(--warn-weak)}
.note.bad{background:var(--bad-weak)}
.note.good{background:var(--good-weak)}
.insight{display:flex;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface-2);margin-bottom:7px;font-size:.83rem;align-items:flex-start}
.insight .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--primary)}
.insight.good .dot{background:var(--good)} .insight.warn .dot{background:var(--warn)} .insight.bad .dot{background:var(--bad)}
.reco{border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--radius-sm);padding:9px 12px;
  margin-bottom:8px;background:var(--surface)}
.reco .r-trigger{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.reco .r-action{font-size:.86rem}
.tag-demo{font-size:.68rem;background:var(--warn-weak);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:700}
.report-sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.report-sheet .r-head{text-align:center;border-bottom:2px solid var(--border);padding-bottom:12px;margin-bottom:14px}
.report-sheet .r-head h1{margin:0;font-size:1.25rem}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);justify-content:center;margin-top:6px}
.mobile-nav{display:none}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}

/* ---------- Responsive ---------- */
@media (max-width:1200px){ .g-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))} }
@media (max-width:992px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:262px;transform:translateX(-100%);transition:transform .18s ease-out}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(6,14,28,.5)}
  .hamburger{display:inline-flex}
  .search-wrap{max-width:none}
}
@media (max-width:768px){
  .content{padding:12px}
  .user-chip .u-name,.user-chip .u-role{display:none}
  .mobile-nav{display:flex;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:35}
  .mobile-nav a{flex:1;text-align:center;padding:8px 2px;font-size:.66rem;color:var(--muted);text-decoration:none}
  .mobile-nav a.active{color:var(--primary);font-weight:700}
  .mobile-nav a .ico{display:block;font-size:1.05rem}
  body{padding-bottom:0}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media (max-width:576px){
  .page-head{flex-direction:column}
  .kpi .k-value{font-size:1.35rem}
  .modal{max-width:none}
}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.mobile-nav,.toasts,.no-print,.modal-back{display:none !important}
  .app{display:block}
  body{background:#fff;color:#000;font-size:11.5pt}
  .content{padding:0}
  .card,.report-sheet,.kpi{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  .table-scroll{overflow:visible;border:1px solid #bbb}
  table.data{min-width:0;font-size:10pt}
  a{color:#000;text-decoration:none}
}
</style>

          pts.map(function (p) { return p.x + ',' + p.y; }).join(' ') + '"/>');
        pts.forEach(function (p) {
          parts.push('<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="' + color + '"><title>' +
            esc(s.name + ': ' + p.v) + '</title></circle>');
        });
      });
      parts.push('</svg>');
      var legend = '<div class="legend">' + series.map(function (s, si) {
        return '<span><i style="background:' + (s.color || Charts.COLORS[si % Charts.COLORS.length]) + '"></i>' + esc(s.name) + '</span>';
      }).join('') + '</div>';
      return parts.join('') + legend;
    },

    bar: function (opts) {
      var labels = opts.labels || [];
      var values = opts.values || [];
      var w = 760, h = 280, pl = 46, pr = 16, pt = 16, pb = 58;
      var iw = w - pl - pr, ih = h - pt - pb;
      var yMax = opts.yMax || 100;
      if (!labels.length) { return '<div class="chart-empty">No academic records match the selected filters.</div>'; }
      var n = labels.length;
      var step = iw / n;
      var bw = Math.max(8, Math.min(58, step * 0.6));
      var parts = [];
      parts.push('<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.title || 'Bar chart') + '" preserveAspectRatio="xMidYMid meet">');
      for (var g = 0; g <= 5; g++) {
        var gy = pt + ih - (g / 5) * ih;
        parts.push('<line x1="' + pl + '" y1="' + gy + '" x2="' + (pl + iw) + '" y2="' + gy + '" stroke="currentColor" stroke-opacity="0.12"/>');
        parts.push('<text x="' + (pl - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.55">' +
          round((yMax * g) / 5, 0) + '</text>');
      }
      labels.forEach(function (lb, i) {
        var x = pl + step * i + step / 2;
        var v = clamp(values[i] || 0, 0, yMax);
        var bh = (v / yMax) * ih;
        var y = pt + ih - bh;
        var color = opts.colors && opts.colors[i] ? opts.colors[i] : Charts.COLORS[i % Charts.COLORS.length];
        parts.push('<rect x="' + (x - bw / 2) + '" y="' + y + '" width="' + bw + '" height="' + Math.max(bh, 1) +
          '" rx="3" fill="' + color + '"><title>' + esc(lb + ': ' + (values[i] === null ? 'n/a' : round(values[i], 1))) + '</title></rect>');
        parts.push('<text x="' + x + '" y="' + (h - 40) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity="0.65">' +
          esc(String(lb).slice(0, 12)) + '</text>');
      });
      parts.push('</svg>');
      return parts.join('');
    },

    donut: function (opts) {
      var segments = (opts.segments || []).filter(function (s) { return s.value > 0; });
      if (!segments.length) { return '<div class="chart-empty">No academic records match the selected filters.</div>'; }
      var total = sum(segments.map(function (s) { return s.value; }));
      var size = 240, r = 88, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
      var offset = 0;
      var parts = [];
      parts.push('<svg class="chart" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(opts.title || 'Donut chart') + '" style="max-width:240px;margin:0 auto">');
      parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="currentColor" stroke-opacity="0.1" stroke-width="26"/>');
      segments.forEach(function (s, i) {
        var frac = s.value / total;
        var len = frac * circ;
        var color = s.color || Charts.COLORS[i % Charts.COLORS.length];
        parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color +
          '" stroke-width="26" stroke-dasharray="' + round(len, 2) + ' ' + round(circ - len, 2) +
          '" stroke-dashoffset="' + round(-offset, 2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' +
          esc(s.label + ': ' + s.value + ' (' + round(frac * 100, 1) + '%)') + '</title></circle>');
        offset += len;
      });
      parts.push('<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">' + total + '</text>');
      parts.push('<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.6">' + esc(opts.unit || 'records') + '</text>');
      parts.push('</svg>');
      var legend = '<div class="legend" style="justify-content:center">' + segments.map(function (s, i) {
        return '<span><i style="background:' + (s.color || Charts.COLORS[i % Charts.COLORS.length]) + '"></i>' +
          esc(s.label) + ' · ' + s.value + ' (' + round((s.value / total) * 100, 1) + '%)</span>';
      }).join('') + '</div>';
      return parts.join('') + legend;
    },

    progressList: function (rows, opts) {
      opts = opts || {};
      if (!rows.length) { return '<div class="chart-empty">No academic records match the selected filters.</div>'; }
      var max = opts.max || 100;
      return rows.map(function (r) {
        var v = clamp(r.value, 0, max);
        var w = (v / max) * 100;
        var tone = opts.toneFn ? opts.toneFn(r.value) : '';
        return '<div class="progress-row"><span class="p-label">' + esc(r.label) + '</span>' +
          '<div class="progress ' + tone + '" role="progressbar" aria-valuenow="' + round(v, 1) +
          '" aria-valuemin="0" aria-valuemax="' + max + '"><span style="width:' + w + '%"></span></div>' +
          '<span class="p-val">' + (r.display !== undefined ? esc(r.display) : round(v, 1)) + '</span></div>';
      }).join('');
    }
  };

  /* ======================================================================
     7. MOCK API / SERVICE LAYER
     Every function below is the single replacement point for a production
     REST endpoint. The UI never touches storage directly.
     ====================================================================== */
  var Service = {
    faculties: function () { return Store.get('sc_faculties', []); },
    departments: function () { return Store.get('sc_departments', []); },
    programmes: function () { return Store.get('sc_programmes', []); },
    courses: function () { return Store.get('sc_courses', []); },
    students: function () { return Store.get('sc_students', []); },
    results: function () { return Store.get('sc_results', []); },
    users: function () { return Store.get('sc_users', []); },
    semesters: function () { return Store.get('sc_semesters', []); },
    interventions: function () { return Store.get('sc_interventions', []); },
    notifications: function () { return Store.get('sc_notifications', []); },
    alerts: function () { return Store.get('sc_alerts', []); },
    auditLogs: function () { return Store.get('sc_audit_logs', []); },
    settings: function () { return Store.get('sc_settings', null); },

    saveSettings: function (s) {
      Store.set('sc_settings', s);
      Service.audit('Settings changed', 'sc_settings', 'Institutional settings updated');
    },
    saveStudents: function (list) { Store.set('sc_students', list); },
    saveResults: function (list) { Store.set('sc_results', list); },
    saveCourses: function (list) { Store.set('sc_courses', list); },
    saveUsers: function (list) { Store.set('sc_users', list); },
    saveInterventions: function (list) { Store.set('sc_interventions', list); },
    saveNotifications: function (list) { Store.set('sc_notifications', list); },
    saveAlerts: function (list) { Store.set('sc_alerts', list); },
    saveSemesters: function (list) { Store.set('sc_semesters', list); },
    saveFaculties: function (list) { Store.set('sc_faculties', list); },
    saveDepartments: function (list) { Store.set('sc_departments', list); },

    audit: function (action, target, description) {
      var logs = Service.auditLogs();
      var u = Auth.current();
      logs.unshift({
        id: uid('AUD'),
        action: action,
        user: u ? u.email : 'system',
        role: u ? u.role : 'system',
        target: target || '',
        description: description || '',
        date: new Date().toISOString()
      });
      if (logs.length > 300) { logs = logs.slice(0, 300); }
      Store.set('sc_audit_logs', logs);
    },

    /* ---- lookups ------------------------------------------------------ */
    student: function (id) { return byId(Service.students(), id); },
    course: function (id) { return byId(Service.courses(), id); },
    courseByCode: function (code) {
      var c = Service.courses().filter(function (x) { return x.code.toUpperCase() === String(code).toUpperCase(); });
      return c.length ? c[0] : null;
    },
    resultsFor: function (studentId) {
      return Service.results().filter(function (r) { return r.studentId === studentId; });
    },
    resultsForCourse: function (courseId) {
      return Service.results().filter(function (r) { return r.courseId === courseId; });
    },
    lecturerOf: function (course) {
      if (!course) { return null; }
      return byId(Service.users(), course.lecturerId);
    },

    /* ---- role-scoped visibility --------------------------------------- */
    visibleStudents: function (user) {
      var all = Service.students();
      if (!user) { return []; }
      if (user.role === 'student') {
        return all.filter(function (s) { return s.id === user.linkedId; });
      }
      if (user.role === 'lecturer') {
        var mine = Service.courses().filter(function (c) { return c.lecturerId === user.id; });
        var ids = {};
        mine.forEach(function (c) {
          Service.resultsForCourse(c.id).forEach(function (r) { ids[r.studentId] = 1; });
        });
        return all.filter(function (s) { return ids[s.id]; });
      }
      if (user.role === 'department_admin') {
        return all.filter(function (s) { return s.department === user.department; });
      }
      return all;
    },

    visibleCourses: function (user) {
      var all = Service.courses();
      if (user && user.role === 'lecturer') {
        return all.filter(function (c) { return c.lecturerId === user.id; });
      }
      if (user && user.role === 'department_admin') {
        return all.filter(function (c) { return c.department === user.department; });
      }
      return all;
    },

    /* ---- calculations -------------------------------------------------- */
    gpa: function (resultList) {
      var units = sum(resultList.map(function (r) { return r.creditUnit; }));
      if (!units) { return null; }
      return round(sum(resultList.map(function (r) { return r.gradePoint * r.creditUnit; })) / units, 2);
    },
    cgpa: function (studentId) { return Service.gpa(Service.resultsFor(studentId)); },
    periodKey: function (r) { return r.session + ' · ' + r.semester; },
    periodsOrdered: function () {
      return PERIOD_DEFS.map(function (p) { return { key: p[1] + ' · ' + p[2], session: p[1], semester: p[2] }; });
    },
    periodGPA: function (resultList, key) {
      return Service.gpa(resultList.filter(function (r) { return Service.periodKey(r) === key; }));
    },
    creditsEarned: function (resultList, passMark) {
      return sum(resultList.filter(function (r) { return r.score >= passMark; }).map(function (r) { return r.creditUnit; }));
    },

    /* Risk score: transparent weighted rule model, 0-100.
       GPA shortfall (30) + failure proportion (25) + attendance shortfall (20)
       + declining GPA trend (15) + credit-progress shortfall (10).          */
    risk: function (student, resultList) {
      var settings = Service.settings() || { academic: { passMark: 40 }, risk: { gpaThreshold: 2.5, attendanceThreshold: 70, decliningThreshold: 0.3 } };
      var passMark = settings.academic.passMark;
      var cfg = settings.risk;
      if (!resultList.length) {
        return { score: 0, band: 'Low', factors: ['No academic records available'], parts: {}, cgpa: null, failures: 0 };
      }
      var cgpa = Service.gpa(resultList) || 0;

      var gpaRisk = clamp((cfg.gpaThreshold - cgpa) / cfg.gpaThreshold, 0, 1) * 30;

      var failures = resultList.filter(function (r) { return r.score < passMark; }).length;
      var failureRisk = clamp((failures / resultList.length) * 3, 0, 1) * 25;

      var attendanceRisk = clamp((cfg.attendanceThreshold + 5 - student.attendance) / (cfg.attendanceThreshold + 5), 0, 1) * 20;

      var keys = Service.periodsOrdered().map(function (p) { return p.key; });
      var present = keys.filter(function (k) {
        return resultList.some(function (r) { return Service.periodKey(r) === k; });
      });
      var latest = present.length ? (Service.periodGPA(resultList, present[present.length - 1]) || 0) : 0;
      var previous = present.length > 1 ? (Service.periodGPA(resultList, present[present.length - 2]) || 0) : latest;
      var trendRisk = clamp((previous - latest) / 1.0, 0, 1) * 15;

      var expected = EXPECTED_CREDITS[student.level] || 20;
      var earned = Service.creditsEarned(resultList, passMark);
      var creditRisk = clamp((expected - earned) / expected, 0, 1) * 10;

      var score = Math.round(clamp(gpaRisk + failureRisk + attendanceRisk + trendRisk + creditRisk, 0, 100));
      var band = score >= 75 ? 'Critical' : score >= 50 ? 'High' : score >= 25 ? 'Moderate' : 'Low';

      var factors = [];
      if (cgpa < cfg.gpaThreshold) { factors.push('Low cumulative GPA (' + cgpa.toFixed(2) + ')'); }
      if (latest < previous - cfg.decliningThreshold) { factors.push('Declining GPA trend'); }
      if (failures > 0) { factors.push(failures + ' failed course' + (failures > 1 ? 's' : '')); }
      if (student.attendance < cfg.attendanceThreshold) { factors.push('Low attendance (' + student.attendance + '%)'); }
      if (earned < expected) { factors.push('Slow credit completion (' + earned + '/' + expected + ' units)'); }
      if (!factors.length) { factors.push('No significant risk factors detected'); }

      return {
        score: score, band: band, factors: factors, cgpa: cgpa, failures: failures,
        parts: {
          'GPA shortfall': round(gpaRisk, 1),
          'Failure proportion': round(failureRisk, 1),
          'Attendance shortfall': round(attendanceRisk, 1),
          'Declining GPA trend': round(trendRisk, 1),
          'Credit progress': round(creditRisk, 1)
        }
      };
    },

    /* Rule-based recommendation engine — triggers and actions. */
    recommendations: function (student, resultList) {
      var settings = Service.settings();
      var cfg = settings.risk;
      var passMark = settings.academic.passMark;
      var out = [];
      var cgpa = Service.gpa(resultList) || 0;
      var failures = resultList.filter(function (r) { return r.score < passMark; }).length;
      var keys = Service.periodsOrdered().map(function (p) { return p.key; });
      var present = keys.filter(function (k) { return resultList.some(function (r) { return Service.periodKey(r) === k; }); });
      var latest = present.length ? (Service.periodGPA(resultList, present[present.length - 1]) || 0) : 0;
      var previous = present.length > 1 ? (Service.periodGPA(resultList, present[present.length - 2]) || 0) : latest;

      if (cgpa < cfg.gpaThreshold) { out.push({ trigger: 'Low GPA', action: 'Schedule an academic advising session.' }); }
      if (student.attendance < cfg.attendanceThreshold) { out.push({ trigger: 'Low attendance', action: 'Review attendance barriers and contact the student.' }); }
      if (failures >= cfg.failureThreshold) { out.push({ trigger: 'Repeated failure', action: 'Recommend targeted tutoring or course support.' }); }
      if (latest < previous - cfg.decliningThreshold) { out.push({ trigger: 'Declining performance', action: 'Monitor performance closely over the next assessment period.' }); }
      if (resultList.some(function (r) { return r.score < 35; })) { out.push({ trigger: 'Missing assessments', action: 'Contact the student regarding outstanding assessments.' }); }
      if (!out.length) { out.push({ trigger: 'On track', action: 'No intervention required; continue routine monitoring.' }); }
      return out;
    },

    /* ---- prediction service interface (MVP estimates, rule-based) ------ */
    predictAcademicRisk: function (student, resultList) {
      var r = Service.risk(student, resultList);
      return { value: r.score, band: r.band, label: 'MVP Estimate', method: 'rule-based weighted model' };
    },
    predictCourseFailure: function (student, resultList) {
      var settings = Service.settings();
      var fail = resultList.filter(function (r) { return r.score < settings.academic.passMark; }).length;
      return { value: resultList.length ? round((fail / resultList.length) * 100, 1) : 0, label: 'MVP Estimate', method: 'historical failure proportion' };
    },
    predictRetentionRisk: function (student) {
      return { value: student.status === 'inactive' ? 100 : 0, label: 'MVP Estimate', method: 'enrolment status' };
    },
    predictExpectedGPA: function (student, resultList) {
      var keys = Service.periodsOrdered().map(function (p) { return p.key; });
      var vals = keys.map(function (k) { return Service.periodGPA(resultList, k); }).filter(function (v) { return v !== null; });
      if (vals.length < 2) { return { value: vals.length ? vals[0] : null, label: 'MVP Estimate', method: 'insufficient history' }; }
      var slope = (vals[vals.length - 1] - vals[0]) / (vals.length - 1);
      return { value: round(clamp(vals[vals.length - 1] + slope, 0, 5), 2), label: 'MVP Estimate', method: 'linear trend projection' };
    },

    /* ---- analytics context -------------------------------------------- */
    context: function (user, filters) {
      filters = filters || {};
      var settings = Service.settings();
      var passMark = settings.academic.passMark;
      var all = Service.visibleStudents(user);
      var students = all.slice();

      if (filters.faculty) { students = students.filter(function (s) { return s.faculty === filters.faculty; }); }
      if (filters.department) { students = students.filter(function (s) { return s.department === filters.department; }); }
      if (filters.programme) { students = students.filter(function (s) { return s.programme === filters.programme; }); }
      if (filters.level) { students = students.filter(function (s) { return String(s.level) === String(filters.level); }); }
      if (filters.gender) { students = students.filter(function (s) { return s.gender === filters.gender; }); }
      if (filters.session) { students = students.filter(function (s) { return s.session === filters.session; }); }
      if (filters.status) { students = students.filter(function (s) { return s.status === filters.status; }); }

      var byStudent = {};
      var allResults = Service.results();
      allResults.forEach(function (r) {
        if (!byStudent[r.studentId]) { byStudent[r.studentId] = []; }
        byStudent[r.studentId].push(r);
      });

      var enriched = students.map(function (s) {
        var rs = (byStudent[s.id] || []).slice();
        var scope = rs.filter(function (r) {
          if (filters.session && r.session !== filters.session) { return false; }
          if (filters.semester && r.semester !== filters.semester) { return false; }
          return true;
        });
        var rk = Service.risk(s, scope);
        return { student: s, results: scope, allResults: rs, risk: rk, cgpa: Service.gpa(scope) };
      });

      if (filters.risk) { enriched = enriched.filter(function (e) { return e.risk.band === filters.risk; }); }
      if (filters.minCgpa !== '' && filters.minCgpa !== undefined && filters.minCgpa !== null) {
        enriched = enriched.filter(function (e) { return e.cgpa !== null && e.cgpa >= Number(filters.minCgpa); });
      }
      if (filters.maxCgpa !== '' && filters.maxCgpa !== undefined && filters.maxCgpa !== null) {
        enriched = enriched.filter(function (e) { return e.cgpa !== null && e.cgpa <= Number(filters.maxCgpa); });
      }

      var results = [];
      enriched.forEach(function (e) { results = results.concat(e.results); });

      var gpas = enriched.map(function (e) { return e.cgpa; }).filter(function (v) { return v !== null; });
      var passed = results.filter(function (r) { return r.score >= passMark; });
      var failed = results.filter(function (r) { return r.score < passMark; });
      var active = enriched.filter(function (e) { return e.student.status === 'active'; });
      var atRisk = enriched.filter(function (e) { return e.risk.band === 'High' || e.risk.band === 'Critical'; });
      var critical = enriched.filter(function (e) { return e.risk.band === 'Critical'; });
      var finalYear = enriched.filter(function (e) { return e.student.level === 400; });
      var ready = finalYear.filter(function (e) {
        return Service.creditsEarned(e.allResults, passMark) >= settings.academic.requiredCredits * 0.5;
      });

      var metrics = {
        totalStudents: enriched.length,
        activeStudents: active.length,
        averageGPA: gpas.length ? round(mean(gpas), 2) : null,
        passRate: results.length ? round(pct(passed.length, results.length), 1) : null,
        failureRate: results.length ? round(pct(failed.length, results.length), 1) : null,
        atRiskCount: atRisk.length,
        criticalCount: critical.length,
        retentionRate: enriched.length ? round(pct(active.length, enriched.length), 1) : null,
        graduationRate: finalYear.length ? round(pct(ready.length, finalYear.length), 1) : null,
        averageCourseScore: results.length ? round(mean(results.map(function (r) { return r.score; })), 1) : null,
        averageAttendance: results.length ? round(mean(results.map(function (r) { return r.attendance; })), 1) : null,
        resultCount: results.length
      };

      return {
        settings: settings, passMark: passMark, enriched: enriched, students: enriched.map(function (e) { return e.student; }),
        results: results, metrics: metrics, atRisk: atRisk, ready: ready
      };
    },

    /* ---- rule-based insight engine ------------------------------------- */
    insights: function (ctx) {
      var out = [];
      var settings = ctx.settings;
      var byCourse = groupBy(ctx.results, function (r) { return r.courseId; });

      Object.keys(byCourse).forEach(function (cid) {
        var course = Service.course(cid);
        if (!course) { return; }
        var rs = byCourse[cid];
        var rate = pct(rs.filter(function (r) { return r.score >= ctx.passMark; }).length, rs.length);
        if (rate < 60) {
          out.push({ tone: 'bad', text: course.code + ' — pass rate is ' + round(rate, 1) + '% (' + rs.length + ' records). Course performance requires attention.' });
        }
      });

      var keys = Service.periodsOrdered().map(function (p) { return p.key; });
      var trend = keys.map(function (k) {
        var rs = ctx.results.filter(function (r) { return Service.periodKey(r) === k; });
        return rs.length ? Service.gpa(rs) : null;
      }).filter(function (v) { return v !== null; });

      if (trend.length > 1) {
        var delta = trend[trend.length - 1] - trend[0];
        if (delta < -0.3) { out.push({ tone: 'warn', text: 'Average GPA has declined by ' + round(Math.abs(delta), 2) + ' points compared with the earliest selected period.' }); }
        else if (delta > 0.3) { out.push({ tone: 'good', text: 'Average GPA has improved by ' + round(delta, 2) + ' points across the selected periods.' }); }
      }

      if (ctx.metrics.averageAttendance !== null && ctx.metrics.averageAttendance < settings.academic.attendanceThreshold) {
        out.push({ tone: 'warn', text: 'Average attendance (' + ctx.metrics.averageAttendance + '%) is below the configured threshold of ' + settings.academic.attendanceThreshold + '%.' });
      }
      if (ctx.metrics.criticalCount > 0) {
        out.push({ tone: 'bad', text: ctx.metrics.criticalCount + ' student' + (ctx.metrics.criticalCount > 1 ? 's are' : ' is') + ' in the Critical risk band. Immediate academic intervention recommended.' });
      }
      if (ctx.metrics.failureRate !== null && ctx.metrics.failureRate > 25) {
        out.push({ tone: 'warn', text: 'Failure rate is ' + ctx.metrics.failureRate + '%, which exceeds 25% for the current selection.' });
      }

      /* Attendance vs performance — computed, never asserted. */
      var low = ctx.results.filter(function (r) { return r.attendance < settings.academic.attendanceThreshold; });
      var rest = ctx.results.filter(function (r) { return r.attendance >= settings.academic.attendanceThreshold; });
      if (low.length && rest.length) {
        var f1 = pct(low.filter(function (r) { return r.score < ctx.passMark; }).length, low.length);
        var f2 = pct(rest.filter(function (r) { return r.score < ctx.passMark; }).length, rest.length);
        out.push({
          tone: f1 > f2 ? 'warn' : 'good',
          text: 'Students with attendance below ' + settings.academic.attendanceThreshold + '% show a ' + round(f1, 1) +
            '% failure rate, compared with ' + round(f2, 1) + '% for those at or above it, in the selected dataset.'
        });
      }

      if (!out.length) { out.push({ tone: 'good', text: 'No threshold breaches detected in the current selection.' }); }
      return out;
    },

    /* ---- alert generation ---------------------------------------------- */
    generateAlerts: function () {
      var settings = Service.settings();
      var alerts = [];
      var courses = Service.courses();
      var results = Service.results();
      var students = Service.students();

      courses.forEach(function (c) {
        var rs = results.filter(function (r) { return r.courseId === c.id; });
        var below = rs.filter(function (r) { return r.score < settings.academic.passMark; });
        if (below.length >= 3) {
          alerts.push({
            id: uid('ALT'), type: 'Course failure alert',
            severity: below.length >= 6 ? 'Critical' : 'High',
            title: below.length + ' students in ' + c.code + ' have fallen below the performance threshold.',
            detail: c.title + ' — ' + rs.length + ' records assessed.',
            target: '#/course/' + c.id, date: new Date().toISOString(), read: false
          });
        }
      });

      var keys = Service.periodsOrdered().map(function (p) { return p.key; });
      if (keys.length >= 2) {
        var pen = keys[keys.length - 2], last = keys[keys.length - 1];
        var depts = Service.departments();
        depts.forEach(function (d) {
          var cids = courses.filter(function (c) { return c.department === d.name; }).map(function (c) { return c.id; });
          var before = results.filter(function (r) { return cids.indexOf(r.courseId) >= 0 && Service.periodKey(r) === pen; });
          var after = results.filter(function (r) { return cids.indexOf(r.courseId) >= 0 && Service.periodKey(r) === last; });
          if (!before.length || !after.length) { return; }
          var fr1 = pct(before.filter(function (r) { return r.score < settings.academic.passMark; }).length, before.length);
          var fr2 = pct(after.filter(function (r) { return r.score < settings.academic.passMark; }).length, after.length);
          if (fr2 - fr1 > 2) {
            alerts.push({
              id: uid('ALT'), type: 'Performance threshold exceeded', severity: 'High',
              title: 'Department of ' + d.name + ' failure rate increased by ' + round(fr2 - fr1, 1) + '% between the last two periods.',
              detail: pen + ' → ' + last, target: '#/departments', date: new Date().toISOString(), read: false
            });
          }
        });
      }

      var atRisk = students.filter(function (s) {
        var rs = Service.resultsFor(s.id);
        var rk = Service.risk(s, rs);
        return rk.band === 'High' || rk.band === 'Critical';
      });
      if (atRisk.length) {
        alerts.push({
          id: uid('ALT'), type: 'At-risk student alert',
          severity: atRisk.length > 20 ? 'Critical' : 'High',
          title: atRisk.length + ' students require academic intervention.',
          detail: 'Calculated from the current dataset using the MVP rule-based risk model.',
          target: '#/at-risk', date: new Date().toISOString(), read: false
        });
      }
      return alerts;
    },

    /* ---- notifications -------------------------------------------------- */
    createNotification: function (type, title, body, target) {
      var list = Service.notifications();
      list.unshift({ id: uid('NTF'), type: type, title: title, body: body, target: target || '', date: new Date().toISOString(), read: false });
      Service.saveNotifications(list);
    },
    unreadCount: function () {
      return Service.notifications().filter(function (n) { return !n.read; }).length +
        Service.alerts().filter(function (a) { return !a.read; }).length;
    },

    /* ---- CSV validation and import ------------------------------------- */
    requiredColumns: ['student_id', 'student_name', 'faculty', 'department', 'programme', 'level',
      'session', 'semester', 'course_code', 'course_title', 'credit_unit', 'score', 'grade',
      'attendance', 'assessment_score', 'exam_score'],

    parseCSV: function (text) {
      var rows = [], row = [], field = '', inQ = false;
      text = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      for (var i = 0; i < text.length; i++) {
        var c = text[i];
        if (inQ) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQ = false; }
          } else { field += c; }
          continue;
        }
        if (c === '"') { inQ = true; continue; }
        if (c === ',') { row.push(field); field = ''; continue; }
        if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
        field += c;
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(function (r) { return !(r.length === 1 && String(r[0]).trim() === ''); });
    },

    validateImport: function (text) {
      var settings = Service.settings();
      var scale = settings.academic.gradingScale;
      var rows = Service.parseCSV(text);
      if (!rows.length) { return { ok: false, error: 'The file appears to be empty.' }; }
      var headers = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
      var missing = Service.requiredColumns.filter(function (c) { return headers.indexOf(c) < 0; });
      if (missing.length) {
        return { ok: false, error: 'The file is missing required columns: ' + missing.join(', ') + '.' };
      }
      var body = rows.slice(1);
      var seen = {};
      var validated = [];

      body.forEach(function (raw, i) {
        var rec = {};
        headers.forEach(function (h, idx) { rec[h] = raw[idx] === undefined ? '' : String(raw[idx]).trim(); });
        var errors = [];

        if (!rec.student_id) { errors.push('Missing student_id'); }
        if (!rec.student_name) { errors.push('Missing student_name'); }
        if (!rec.course_code) { errors.push('Missing course_code'); }
        if (rec.level && [100, 200, 300, 400].indexOf(Number(rec.level)) < 0) { errors.push('Invalid level'); }

        var score = Number(rec.score);
        if (rec.score === '' || isNaN(score)) { errors.push('Score missing or non-numeric'); }
        else if (score < 0 || score > 100) { errors.push('Score must be 0-100'); }

        if (rec.attendance !== '' && rec.attendance !== undefined) {
          var at = Number(rec.attendance);
          if (isNaN(at) || at < 0 || at > 100) { errors.push('Attendance must be 0-100'); }
        }
        var cu = Number(rec.credit_unit);
        if (rec.credit_unit === '' || isNaN(cu) || cu <= 0) { errors.push('Credit units must be greater than 0'); }
        if (rec.semester && ['First', 'Second'].indexOf(rec.semester) < 0) { errors.push('Invalid semester'); }
        if (rec.session && !/^\d{4}\/\d{4}$/.test(rec.session)) { errors.push('Invalid session (expected YYYY/YYYY)'); }
        if (rec.grade && scale.map(function (g) { return g.grade; }).indexOf(rec.grade.toUpperCase()) < 0) { errors.push('Invalid grade'); }

        var key = [rec.student_id, rec.course_code, rec.session, rec.semester].join('|');
        if (seen[key]) { errors.push('Duplicate record'); }
        seen[key] = true;

        validated.push({ line: i + 2, record: rec, errors: errors, raw: raw });
      });

      var accepted = validated.filter(function (v) { return !v.errors.length; });
      var rejected = validated.filter(function (v) { return v.errors.length; });
      return {
        ok: true, headers: headers, missingColumns: missing,
        total: body.length, accepted: accepted, rejected: rejected,
        duplicates: rejected.filter(function (r) { return r.errors.indexOf('Duplicate record') >= 0; }).length,
        missingValues: rejected.filter(function (r) { return r.errors.some(function (e) { return e.indexOf('Missing') === 0; }); }).length,
        invalidRecords: rejected.filter(function (r) { return r.errors.some(function (e) { return e.indexOf('Invalid') === 0 || e.indexOf('must be') >= 0 || e.indexOf('non-numeric') >= 0; }); }).length
      };
    },

    commitImport: function (validation) {
      var settings = Service.settings();
      var students = Service.students().slice();
      var courses = Service.courses().slice();
      var results = Service.results().slice();
      var createdStudents = 0, createdCourses = 0, stored = 0;
      var maxRes = results.reduce(function (m, r) { return Math.max(m, Number(String(r.id).replace(/\D/g, '')) || 0); }, 0);

      validation.accepted.forEach(function (v) {
        var rec = v.record;
        var st = students.filter(function (s) { return s.studentId === rec.student_id; })[0];
        if (!st) {
          st = {
            id: 'STU' + pad(students.length + 1, 3), studentId: rec.student_id, name: rec.student_name || 'Imported Student',
            gender: '', email: slug(rec.student_name || 'imported') + '@student.academiciq.demo',
            programme: rec.programme || '', department: rec.department || '', faculty: rec.faculty || '',
            level: Number(rec.level) || 100, session: rec.session || '2025/2026', attendance: Number(rec.attendance) || 0,
            ability: 0.5, status: 'active', createdAt: new Date().toISOString()
          };
          students.push(st); createdStudents++;
        }
        var crs = courses.filter(function (c) { return c.code.toUpperCase() === String(rec.course_code).toUpperCase(); })[0];
        if (!crs) {
          crs = {
            id: 'CRS' + pad(courses.length + 1, 3), code: rec.course_code.toUpperCase(),
            title: rec.course_title || rec.course_code, department: rec.department || st.department,
            creditUnit: Number(rec.credit_unit) || 3, level: Number(rec.level) || st.level, lecturerId: ''
          };
          courses.push(crs); createdCourses++;
        }
        var score = clamp(Number(rec.score), 0, 100);
        var band = gradeFor(score, settings.academic.gradingScale);
        maxRes++;
        results.push({
          id: 'RES' + pad(maxRes, 4), studentId: st.id, courseId: crs.id,
          session: rec.session, semester: rec.semester, score: score,
          grade: rec.grade ? rec.grade.toUpperCase() : band.grade,
          gradePoint: band.point, creditUnit: Number(rec.credit_unit) || crs.creditUnit,
          attendance: rec.attendance === '' ? 0 : Number(rec.attendance),
          assessmentScore: Number(rec.assessment_score) || 0,
          examScore: Number(rec.exam_score) || 0,
          imported: true, createdAt: new Date().toISOString()
        });
        stored++;
      });

      /* recompute student attendance from the full record set */
      students.forEach(function (s) {
        var rs = results.filter(function (r) { return r.studentId === s.id; });
        if (rs.length) { s.attendance = Math.round(mean(rs.map(function (r) { return r.attendance; }))); }
      });

      Service.saveStudents(students);
      Service.saveCourses(courses);
      Service.saveResults(results);
      Service.audit('Data imported', 'sc_results', stored + ' result records stored; ' + createdStudents + ' students and ' + createdCourses + ' courses created.');
      Service.createNotification('Data import completed', 'Data import completed',
        stored + ' records stored, ' + validation.rejected.length + ' rejected.', '#/data-import');
      Store.set('sc_alerts', Service.generateAlerts());

      return { stored: stored, createdStudents: createdStudents, createdCourses: createdCourses, rejected: validation.rejected.length };
    },

    sampleCSV: function () {
      var lines = [Service.requiredColumns.join(',')];
      var settings = Service.settings();
      var students = Service.students();
      var courses = Service.courses();
      for (var i = 0; i < 3; i++) {
        var s = students[i];
        var c = courses[i % courses.length];
        var score = 62 + i * 8;
        var g = gradeFor(score, settings.academic.gradingScale);
        lines.push([s.studentId, s.name, s.faculty, s.department, s.programme, s.level, '2025/2026', 'Second',
          c.code, c.title, c.creditUnit, score, g.grade, 80 + i, Math.round(score * 0.4), score - Math.round(score * 0.4)].join(','));
      }
      return lines.join('\n');
    }
  };

  /* ======================================================================
     8. AUTHENTICATION (demonstration only — see security note at top)
     ====================================================================== */
  var Auth = {
    current: function () {
      return Store.get('sc_current_user', null) || Session.get('sc_current_user', null);
    },
    signIn: function (email, password, remember) {
      var users = Service.users();
      var u = users.filter(function (x) { return x.email.toLowerCase() === String(email).trim().toLowerCase(); })[0];
      if (!u) { return { ok: false, error: 'No account found for that university email or ID.' }; }
      if (u.status !== 'active') { return { ok: false, error: 'This account has been suspended.' }; }
      if (u.password !== password) {
        Service.audit('Failed login attempt', u.email, 'Incorrect password supplied');
        return { ok: false, error: 'Incorrect password. Please try again.' };
      }
      var session = {};
      Object.keys(u).forEach(function (k) { if (k !== 'password') { session[k] = u[k]; } });
      session.lastLogin = new Date().toISOString();
      Service.saveUsers(users.map(function (x) {
        if (x.id === u.id) { var y = {}; Object.keys(x).forEach(function (k) { y[k] = x[k]; }); y.lastLogin = session.lastLogin; return y; }
        return x;
      }));
      if (remember) { Store.set('sc_current_user', session); }
      else { Session.set('sc_current_user', session); }
      Service.audit('User login', u.email, ROLE_LABEL[u.role] + ' signed in');
      return { ok: true, user: session };
    },
    register: function (payload) {
      var users = Service.users();
      if (users.some(function (u) { return u.email.toLowerCase() === payload.email.toLowerCase(); })) {
        return { ok: false, error: 'An account already exists for that email address.' };
      }
      var u = {
        id: 'USR' + pad(users.length + 1, 3), name: payload.name, email: payload.email, password: payload.password,
        role: payload.role, faculty: payload.faculty || '', department: payload.department || '',
        programme: payload.programme || '', level: payload.level || null, phone: payload.phone || '',
        universityId: payload.universityId || '', linkedId: '', status: 'active', lastLogin: '',
        createdAt: new Date().toISOString()
      };
      users.push(u);
      Service.saveUsers(users);
      Service.audit('User created', u.email, 'Self-registration as ' + ROLE_LABEL[u.role]);
      return { ok: true, user: u };
    },
    signOut: function () {
      var u = Auth.current();
      if (u) { Service.audit('User sign out', u.email, 'Signed out'); }
      Store.remove('sc_current_user');
      Session.remove('sc_current_user');
    },
    updateProfile: function (patch) {
      var u = Auth.current();
      if (!u) { return; }
      var users = Service.users();
      Service.saveUsers(users.map(function (x) {
        if (x.id !== u.id) { return x; }
        var y = {}; Object.keys(x).forEach(function (k) { y[k] = x[k]; });
        Object.keys(patch).forEach(function (k) { y[k] = patch[k]; });
        return y;
      }));
      var next = {};
      Object.keys(u).forEach(function (k) { next[k] = u[k]; });
      Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
      if (Store.get('sc_current_user', null)) { Store.set('sc_current_user', next); } else { Session.set('sc_current_user', next); }
    }
  };
